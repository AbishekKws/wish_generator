<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WishGen Admin | Secure Login</title>
    <!-- Bootstrap 5.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            --body-bg: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-muted: #94a3b8;
        }

        body { 
            background-color: var(--body-bg);
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(79, 70, 229, 0.15) 0px, transparent 50%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: #f8fafc;
            overflow-x: hidden;
        }

        .login-wrapper {
            width: 100%;
            padding: 24px;
        }

        .login-card { 
            max-width: 440px; 
            margin: auto;
            background: var(--card-bg); 
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 44px 36px; 
            border-radius: 24px; 
            border: 1px solid var(--border-color);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); 
            transition: all 0.3s ease;
        }

        .brand-logo {
            width: 68px;
            height: 68px;
            background: var(--primary-gradient);
            color: white;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin: 0 auto 24px;
            box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.5);
        }

        .input-group-text {
            background-color: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color);
            border-end: none;
            color: var(--text-muted);
            padding-left: 16px;
            padding-right: 12px;
            border-top-left-radius: 12px;
            border-bottom-left-radius: 12px;
        }

        .form-control {
            background-color: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color);
            border-start: none;
            color: #f8fafc;
            padding: 12px 16px;
            font-size: 0.95rem;
            border-top-right-radius: 12px;
            border-bottom-right-radius: 12px;
        }

        .password-toggle {
            background-color: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color);
            border-start: none;
            color: var(--text-muted);
            cursor: pointer;
            border-top-right-radius: 12px;
            border-bottom-right-radius: 12px;
            padding-right: 16px;
        }

        .input-group:focus-within .input-group-text,
        .input-group:focus-within .form-control,
        .input-group:focus-within .password-toggle {
            border-color: #6366f1;
        }

        .form-control:focus {
            background-color: rgba(15, 23, 42, 0.8);
            color: #ffffff;
            box-shadow: none;
        }

        .form-control::placeholder {
            color: #475569;
        }

        .btn-primary { 
            background: var(--primary-gradient); 
            border: none; 
            padding: 14px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.95rem;
            letter-spacing: 0.3px;
            color: white;
            box-shadow: 0 10px 20px -5px rgba(79, 70, 229, 0.4);
            transition: all 0.25s ease;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 25px -5px rgba(79, 70, 229, 0.6);
            opacity: 0.98;
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .footer-text {
            color: var(--text-muted);
            font-size: 0.8rem;
        }

        /* Alert Styling */
        .alert {
            border-radius: 12px;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: #fca5a5;
            font-size: 0.875rem;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 32px 20px;
                border-radius: 20px;
            }
            .brand-logo {
                width: 58px;
                height: 58px;
                font-size: 22px;
            }
        }
    </style>
</head>
<body>

    <div class="login-wrapper">
        <div class="login-card">
            <div class="brand-logo">
                <i class="fas fa-wand-magic-sparkles"></i>
            </div>
            
            <h4 class="text-center fw-bold mb-1 text-white" style="letter-spacing: -0.5px;">SURPRISE ME ADMIN</h4>
            <p class="text-center mb-4 small" style="color: var(--text-muted);">Welcome back! Please login to continue.</p>

            <!-- Django Alert Messages -->
            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-dismissible fade show d-flex align-items-center gap-2 mb-4" role="alert">
                        <i class="fas fa-circle-exclamation me-1"></i>
                        <div>{{ message }}</div>
                        <button type="button" class="btn-close btn-close-white ms-auto shadow-none" data-bs-dismiss="alert" aria-label="Close" style="font-size: 0.75rem;"></button>
                    </div>
                {% endfor %}
            {% endif %}

            <form method="post" autocomplete="off">
                {% csrf_token %}
                
                <div class="mb-3">
                    <label class="form-label fw-semibold small" style="color: #cbd5e1;">Username</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-user-gear"></i></span>
                        <input type="text" name="username" class="form-control" placeholder="Enter username" required autofocus>
                    </div>
                </div>

                <div class="mb-4">
                    <div class="d-flex justify-content-between align-items-center mb-1">
                        <label class="form-label fw-semibold small mb-0" style="color: #cbd5e1;">Password</label>
                    </div>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-lock"></i></span>
                        <input type="password" id="passwordInput" name="password" class="form-control border-end-0" placeholder="••••••••" required>
                        <span class="input-group-text password-toggle" id="togglePassword">
                            <i class="fas fa-eye" id="eyeIcon"></i>
                        </span>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100 mb-3">
                    Enter To Login <i class="fas fa-arrow-right-to-bracket ms-2"></i>
                </button>
            </form>

            <div class="text-center footer-text pt-3 border-top" style="border-color: rgba(255,255,255,0.06) !important;">
                <p class="mb-0">
                    &copy; {% now "Y" %} Wish Generator Ltd. All Rights Reserved.
                </p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Password Visibility Toggle Logic
        document.getElementById('togglePassword').addEventListener('click', function () {
            const passwordInput = document.getElementById('passwordInput');
            const eyeIcon = document.getElementById('eyeIcon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.classList.remove('fa-eye');
                eyeIcon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                eyeIcon.classList.remove('fa-eye-slash');
                eyeIcon.classList.add('fa-eye');
            }
        });
    </script>
</body>
</html>
